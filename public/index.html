<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2C6FBB" />
<!-- personal, non-commercial fan project: it should not be indexed or surfaced by search -->
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Ana Bingo! — a fan-made, unofficial, non-commercial side-scrolling adventure. Bluey © Ludo Studio Pty Ltd." />
<title>Ana Bingo! — a heeler family adventure</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%234A90D9'/><circle cx='36' cy='44' r='9' fill='%23fff'/><circle cx='66' cy='44' r='9' fill='%23fff'/><circle cx='38' cy='46' r='5' fill='%2322303F'/><circle cx='68' cy='46' r='5' fill='%2322303F'/><ellipse cx='52' cy='68' rx='9' ry='7' fill='%2322303F'/></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="Game screen"></canvas>

    <!-- heads-up display, only visible while playing -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div id="hud-score" class="pill">0</div>
        <div id="hud-tokens" class="pill small">0/0</div>
      </div>
      <div class="hud-right">
        <button id="btn-mute" class="icon-btn" aria-label="Sound on or off">🔊</button>
        <button id="btn-pause" class="icon-btn" aria-label="Pause">⏸</button>
      </div>
      <div id="hud-progress"><div id="hud-progress-fill"></div><div id="hud-progress-dog">🐾</div></div>
      <div id="toast-layer"></div>
    </div>

    <!-- everything that is not the canvas lives in overlays -->
    <div id="overlay" class="screen">
      <div class="panel">
        <div class="panel-body">
          <h1 class="title">Ana&nbsp;Bingo!</h1>
          <p class="subtitle">A backyard adventure with the heeler family</p>
          <div id="menu-dogs"></div>
        </div>
        <div class="panel-foot">
          <div id="rotate-hint" class="hidden">↻ Turn your phone sideways for the best view</div>
          <div class="actions">
            <button class="big-btn" id="btn-play">▶ Play</button>
            <div class="btn-row">
              <button class="med-btn" id="btn-chapters">Chapters</button>
              <button class="med-btn" id="btn-gallery">Characters</button>
              <button class="med-btn" id="btn-stats">Stats</button>
            </div>
          </div>
          <p class="tap-hint">Tap anywhere to jump &middot; hold to float<br />
          <button class="link-btn" id="btn-story">The story &rarr;</button></p>
          <p class="credits">Fan-made, unofficial and non-commercial. Bluey &copy; Ludo Studio Pty Ltd.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- The menu above is real markup, so the page has something to show while the
       module and the artwork arrive; nothing is listening on it until main.js has
       run, and on mobile data that is seconds. This is inline and not a module so
       that it runs the moment those buttons exist: it remembers the tap, makes the
       button look pressed, and main.js presses it for real once the live menu is
       there (#284). -->
  <script>
    window.__earlyTap = null;
    for (const id of ["btn-play", "btn-story", "btn-chapters", "btn-gallery", "btn-stats"]) {
      const node = document.getElementById(id);
      if (node) node.addEventListener("click", () => {
        window.__earlyTap = id;
        node.classList.add("waiting");
      });
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
