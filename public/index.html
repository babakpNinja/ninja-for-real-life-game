<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2C6FBB" />
<!-- personal, non-commercial fan project: it should not be indexed or surfaced by search -->
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Ana Bingo! — a fan-made, unofficial, non-commercial side-scrolling adventure. Bluey © Ludo Studio Pty Ltd." />
<title>Ana Bingo! — a heeler family adventure</title>
<!-- One drawing, in a file rather than inline here, because the home-screen
     icons are photographs of it (scripts/render_icon.py) and a second copy of
     the same dog would be free to drift from this one. -->
<link rel="icon" href="assets/icon.svg" />
<!-- Add to Home Screen (#354): iPhone Safari has no element Fullscreen API, so
     a home-screen bookmark is the only way this game fills the screen there.
     The manifest is what every other browser reads; the apple-* tags are what
     iOS reads, and it will not take an SVG for the tile. -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ana Bingo!" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="Game screen"></canvas>

    <!-- heads-up display, only visible while playing -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div id="hud-score" class="pill">0</div>
        <div id="hud-tokens" class="pill small">0/0</div>
        <!-- only while somebody is running with you (#306) -->
        <div id="hud-mult" class="pill mult hidden">×2 🐾</div>
      </div>
      <div class="hud-right">
        <!-- Full screen. Starts hidden and is revealed by main.js only where the
             browser really has the API (iPhone Safari does not have it at all),
             so the failure mode is a missing button rather than an inert one. -->
        <button id="btn-full" class="icon-btn hidden" aria-label="Full screen"></button>
        <button id="btn-mute" class="icon-btn" aria-label="Sound on or off">🔊</button>
        <button id="btn-pause" class="icon-btn" aria-label="Pause">⏸</button>
      </div>
      <div id="hud-progress"><div id="hud-progress-fill"></div><div id="hud-progress-dog">🐾</div></div>
      <!-- the special move. Bottom right, clear of the progress bar in the
           middle: the two are the only things pinned to the bottom edge, and a
           thumb reaching for one must not find the other. -->
      <button id="btn-ability" class="ability-btn hidden" aria-label="Special move">
        <span class="ability-face"><span id="ability-emoji">✨</span></span>
        <span id="ability-name" class="ability-name"></span>
      </button>
      <div id="toast-layer"></div>
    </div>

    <!-- everything that is not the canvas lives in overlays -->
    <div id="overlay" class="screen">
      <div class="panel">
        <div class="panel-body">
          <h1 class="title">Ana&nbsp;Bingo!</h1>
          <p class="subtitle">A backyard adventure with the heeler family</p>
          <div id="menu-dogs"></div>
        </div>
        <div class="panel-foot">
          <div id="rotate-hint" class="hidden">↻ Turn your phone sideways for the best view</div>
          <div class="actions">
            <button class="big-btn" id="btn-play">▶ Play</button>
            <div class="btn-row">
              <button class="med-btn" id="btn-chapters">Chapters</button>
              <button class="med-btn" id="btn-gallery">Characters</button>
              <button class="med-btn" id="btn-stats">Stats</button>
            </div>
          </div>
          <!-- No controls hint here on purpose (#307). It is written by
               controlsHint() in main.js, which is the only thing that knows
               whether there is a finger or a keyboard pointing at this screen
               and whose special move the button in the corner does. Nothing can
               be played until that module has loaded anyway, so the pre-boot
               menu has nothing true to say about how to play — and a second
               copy of the line here is how it drifted in the first place. -->
          <p class="tap-hint"><button class="link-btn" id="btn-story">The story &rarr;</button></p>
          <p class="credits">Fan-made, unofficial and non-commercial. Bluey &copy; Ludo Studio Pty Ltd.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- The menu above is real markup, so the page has something to show while the
       module and the artwork arrive; nothing is listening on it until main.js has
       run, and on mobile data that is seconds. This is inline and not a module so
       that it runs the moment those buttons exist: it remembers the tap, makes the
       button look pressed, and main.js presses it for real once the live menu is
       there (#284). -->
  <script>
    window.__earlyTap = null;
    for (const id of ["btn-play", "btn-story", "btn-chapters", "btn-gallery", "btn-stats"]) {
      const node = document.getElementById(id);
      if (node) node.addEventListener("click", () => {
        window.__earlyTap = id;
        node.classList.add("waiting");
      });
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
